      v1:
        $ref: '#/components/messages/credit-policy.legal-maximum-rate.published.v1'
      v2:
        $ref: '#/components/messages/credit-policy.legal-maximum-rate.published.v2'
  credit-policy.product.defined:
    address: credit-policy.product.defined
    description: A product was defined, with the amounts, durations, arrangement fee and insurance it is sold with.
    messages:
      v1:
        $ref: '#/components/messages/credit-policy.product.defined.v1'
      v2:
        $ref: '#/components/messages/credit-policy.product.defined.v2'
  credit-policy.rate-grid.published:
    address: credit-policy.rate-grid.published
    description: A rate grid of a product took effect, from its date of effect.
    messages:
      v1:
        $ref: '#/components/messages/credit-policy.rate-grid.published.v1'
      v2:
        $ref: '#/components/messages/credit-policy.rate-grid.published.v2'
  credit-policy.residual-income-minimum.published:
    address: credit-policy.residual-income-minimum.published
    description: A residual income minimum of the bank has been published, by its identifier.
    messages:
      v1:
        $ref: '#/components/messages/credit-policy.residual-income-minimum.published.v1'
  customer-due-diligence.customer.advisor-assigned:
    address: customer-due-diligence.customer.advisor-assigned
    description: A customer was given its advisor of the branch network, who looks after it.
    messages:
      v1:
        $ref: '#/components/messages/customer-due-diligence.customer.advisor-assigned.v1'
  customer-due-diligence.customer.identified:
    address: customer-due-diligence.customer.identified
    description: A customer, a person or a business, has been identified before any credit.
    messages:
      v1:
        $ref: '#/components/messages/customer-due-diligence.customer.identified.v1'
  identity.account.deactivated:
    address: identity.account.deactivated
    description: 'An account was deactivated: its person signs in no more, and every context stops acting for it.'
    messages:
      v1:
        $ref: '#/components/messages/identity.account.deactivated.v1'
  identity.delegation.granted:
    address: identity.delegation.granted
    description: A member lent rights to another member of the organisation, from an instant to another.
