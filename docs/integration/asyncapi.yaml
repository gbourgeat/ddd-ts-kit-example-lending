          type:
            type: string
            const: identity.account.deactivated
          version:
            type: integer
            const: 1
          occurredAt:
            type: string
            format: date-time
          payload:
            properties:
              accountId:
                type: string
            type: object
            required:
              - accountId
          traceparent:
            type: string
            description: W3C traceparent captured at publication.
          correlationId:
            type: string
    identity.delegation.granted.v1:
