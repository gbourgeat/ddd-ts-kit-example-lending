      v1:
        $ref: '#/components/messages/credit-policy.delegation-table.published.v1'
      v2:
        $ref: '#/components/messages/credit-policy.delegation-table.published.v2'
  credit-policy.legal-maximum-rate.published:
    address: credit-policy.legal-maximum-rate.published
    description: 'A legal maximum rate of a category took effect: its rate in basis points, from its date of effect.'
