      v1:
        $ref: '#/components/messages/credit-application.credit-application.submitted.v1'
      v2:
        $ref: '#/components/messages/credit-application.credit-application.submitted.v2'
  credit-policy.delegation-table.published:
    address: credit-policy.delegation-table.published
    description: 'A delegation table took effect: the amount each level of decider may approve, from its date of effect.'
