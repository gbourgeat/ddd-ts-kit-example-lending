components:
  messages:
    branch-network.conflict-of-interest.declared.v1:
      name: branch-network.conflict-of-interest.declared
      title: branch-network.conflict-of-interest.declared v1
      summary: 'A member of staff declared a link with a customer: they never prepare nor decide that customer''s applications.'
      contentType: application/json
      tags:
        - name: branch-network
      payload:
        type: object
        required:
          - id
          - type
          - version
          - occurredAt
          - payload
        properties:
          id:
            type: string
            description: 'Unique id of the event: the idempotency key.'
          type:
            type: string
            const: branch-network.conflict-of-interest.declared
          version:
            type: integer
            const: 1
          occurredAt:
            type: string
            format: date-time
          payload:
            properties:
              conflictOfInterestId:
                type: string
              staffMemberId:
                type: string
              customerId:
                type: string
              accountId:
                type: string
            type: object
            required:
              - conflictOfInterestId
              - staffMemberId
              - customerId
              - accountId
          traceparent:
            type: string
            description: W3C traceparent captured at publication.
          correlationId:
            type: string
    branch-network.staff-member.appointed.v1:
      name: branch-network.staff-member.appointed
      title: branch-network.staff-member.appointed v1
