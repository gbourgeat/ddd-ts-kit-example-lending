      v1:
        $ref: '#/components/messages/brokerage.broker.registration-lapsed.v1'
  credit-application.credit-application.decided:
    address: credit-application.credit-application.decided
    description: 'A decider approved, approved with conditions or refused a credit application: the outcome, whether it is an exception, the branch and the amount approved.'
