        $ref: '#/components/messages/branch-network.staff-member.appointed.v1'
      v2:
        $ref: '#/components/messages/branch-network.staff-member.appointed.v2'
  brokerage.broker.registered:
    address: brokerage.broker.registered
    description: A broker is registered with the bank and may bring applications.
    messages:
      v1:
        $ref: '#/components/messages/brokerage.broker.registered.v1'
  brokerage.broker.registration-lapsed:
    address: brokerage.broker.registration-lapsed
    description: 'The registration of a broker lapsed: the broker may no longer bring applications until registered again.'
