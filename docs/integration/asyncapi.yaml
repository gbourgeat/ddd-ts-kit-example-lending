asyncapi: '3.0.0'
info:
  title: lending
  version: '0.1.0'
channels:
  credit-application.credit-application.submitted:
    address: credit-application.credit-application.submitted
    description: 'A borrower or a broker has submitted a loan request: the application file is open, with its applicant, amount in cents and duration in months.'
    messages:
      v1:
        $ref: '#/components/messages/credit-application.credit-application.submitted.v1'
  identity.account.deactivated:
    address: identity.account.deactivated
    description: 'An account was deactivated: its person signs in no more, and every context stops acting for it.'
    messages:
      v1:
        $ref: '#/components/messages/identity.account.deactivated.v1'
  identity.delegation.granted:
    address: identity.delegation.granted
    description: A member lent rights to another member of the organisation, from an instant to another.
    messages:
      v1:
        $ref: '#/components/messages/identity.delegation.granted.v1'
  identity.delegation.revoked:
    address: identity.delegation.revoked
    description: 'A delegation ended before its period: what it lent, the delegate holds no more.'
    messages:
      v1:
        $ref: '#/components/messages/identity.delegation.revoked.v1'
  identity.member.joined:
    address: identity.member.joined
    description: An account became a member of an organisation, in a role.
    messages:
      v1:
        $ref: '#/components/messages/identity.member.joined.v1'
  identity.member.removed:
    address: identity.member.removed
    description: 'A member left an organisation: what they reached there through it, they reach no more.'
    messages:
      v1:
        $ref: '#/components/messages/identity.member.removed.v1'
  identity.member.role-changed:
    address: identity.member.role-changed
    description: The role of a member of an organisation changed.
    messages:
      v1:
        $ref: '#/components/messages/identity.member.role-changed.v1'
  identity.organisation.opened:
    address: identity.organisation.opened
    description: An organisation was opened; with tenants, it is a new tenant.
    messages:
      v1:
        $ref: '#/components/messages/identity.organisation.opened.v1'
  privacy.data-subject.erased:
    address: privacy.data-subject.erased
    description: 'Every copy the platform reaches of a data subject is erased: erase yours.'
    messages:
      v1:
        $ref: '#/components/messages/privacy.data-subject.erased.v1'
operations:
  send.credit-application.credit-application.submitted:
    action: send
    channel:
      $ref: '#/channels/credit-application.credit-application.submitted'
    messages:
      - $ref: '#/channels/credit-application.credit-application.submitted/messages/v1'
  send.identity.account.deactivated:
    action: send
    channel:
      $ref: '#/channels/identity.account.deactivated'
    messages:
      - $ref: '#/channels/identity.account.deactivated/messages/v1'
  send.identity.delegation.granted:
    action: send
    channel:
      $ref: '#/channels/identity.delegation.granted'
    messages:
      - $ref: '#/channels/identity.delegation.granted/messages/v1'
  send.identity.delegation.revoked:
    action: send
    channel:
      $ref: '#/channels/identity.delegation.revoked'
    messages:
      - $ref: '#/channels/identity.delegation.revoked/messages/v1'
  send.identity.member.joined:
    action: send
    channel:
      $ref: '#/channels/identity.member.joined'
    messages:
      - $ref: '#/channels/identity.member.joined/messages/v1'
  send.identity.member.removed:
    action: send
    channel:
      $ref: '#/channels/identity.member.removed'
    messages:
      - $ref: '#/channels/identity.member.removed/messages/v1'
  send.identity.member.role-changed:
    action: send
    channel:
      $ref: '#/channels/identity.member.role-changed'
    messages:
      - $ref: '#/channels/identity.member.role-changed/messages/v1'
  send.identity.organisation.opened:
    action: send
    channel:
      $ref: '#/channels/identity.organisation.opened'
    messages:
      - $ref: '#/channels/identity.organisation.opened/messages/v1'
  send.privacy.data-subject.erased:
    action: send
    channel:
      $ref: '#/channels/privacy.data-subject.erased'
    messages:
      - $ref: '#/channels/privacy.data-subject.erased/messages/v1'
components:
  messages:
    credit-application.credit-application.submitted.v1:
      name: credit-application.credit-application.submitted
      title: credit-application.credit-application.submitted v1
      summary: 'A borrower or a broker has submitted a loan request: the application file is open, with its applicant, amount in cents and duration in months.'
      contentType: application/json
      tags:
        - name: credit-application
      payload:
        type: object
        required:
          - id
          - type
          - version
          - occurredAt
          - payload
        properties:
          id:
            type: string
            description: 'Unique id of the event: the idempotency key.'
          type:
            type: string
            const: credit-application.credit-application.submitted
          version:
            type: integer
            const: 1
          occurredAt:
            type: string
            format: date-time
          payload:
            properties:
              creditApplicationId:
                type: string
              applicantId:
                type: string
              requestedAmountCents:
                type: integer
              durationMonths:
                type: integer
            type: object
            required:
              - creditApplicationId
              - applicantId
              - requestedAmountCents
              - durationMonths
          traceparent:
            type: string
            description: W3C traceparent captured at publication.
          correlationId:
            type: string
    identity.account.deactivated.v1:
      name: identity.account.deactivated
      title: identity.account.deactivated v1
      summary: 'An account was deactivated: its person signs in no more, and every context stops acting for it.'
      contentType: application/json
      tags:
