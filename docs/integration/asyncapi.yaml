    address: branch-network.conflict-of-interest.declared
    description: 'A member of staff declared a link with a customer: they never prepare nor decide that customer''s applications.'
    messages:
      v1:
        $ref: '#/components/messages/branch-network.conflict-of-interest.declared.v1'
  branch-network.staff-member.appointed:
    address: branch-network.staff-member.appointed
    description: A member of staff was appointed to a branch, with the level of the appointment.
