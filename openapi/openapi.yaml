components:
  schemas:
    Accepted:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The identifier of what the command created or changed.
      additionalProperties: false
    DeclaredConflictLine:
      properties:
        conflictOfInterestId:
          type: string
        staffMemberId:
          type: string
        customerId:
          type: string
      type: object
      required:
        - conflictOfInterestId
        - staffMemberId
        - customerId
    IdentifierLine:
      properties:
        id:
          type: string
      type: object
      required:
        - id
    IdentifierLinePage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IdentifierLine'
        total:
          type: integer
          minimum: 0
          description: Present when it is cheap to count.
        nextCursor:
          type: string
          description: Present when more items follow.
    IdentifyCustomerBody:
      properties:
        documentKind:
          type: string
          enum:
            - Passport
            - NationalIdentityCard
            - ResidencePermit
        documentNumber:
          minLength: 1
          type: string
        issuingCountry:
          minLength: 1
          type: string
        documentExpiresOn:
          pattern: \d{4}-[01]\d-[0-3]\dT[0-2]\d:[0-5]\d:[0-5]\d.\d+Z?
          type: string
        address:
          minLength: 1
          type: string
        addressProofDatedOn:
          pattern: \d{4}-[01]\d-[0-3]\dT[0-2]\d:[0-5]\d:[0-5]\d.\d+Z?
          type: string
        name:
          minLength: 1
          type: string
        birthDate:
          pattern: \d{4}-[01]\d-[0-3]\dT[0-2]\d:[0-5]\d:[0-5]\d.\d+Z?
          type: string
      type: object
      required:
        - documentKind
        - documentNumber
        - issuingCountry
        - documentExpiresOn
        - address
        - addressProofDatedOn
        - name
        - birthDate
    InvitationToken:
      properties:
        token:
          minLength: 1
          type: string
      type: object
      required:
        - token
    Problem:
      type: object
      description: Problem details (RFC 9457) with a stable machine-readable code.
      required:
        - type
        - title
        - status
        - code
        - requestId
      properties:
        type:
          type: string
          description: URI identifying the kind of problem.
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable error code; branch on this, not on the title.
        detail:
          type: string
        issues:
          type: array
          description: Present when the request failed validation.
          items:
            type: object
            required:
              - path
              - code
              - message
            properties:
              path:
                type: string
                description: Dotted path, for example body.items.0.sku.
              code:
                type: string
              message:
                type: string
        facts:
          type: object
          description: The facts of the refusal its code exposes, by name. Absent when it exposes none.
          additionalProperties: true
        requestId:
          type: string
    RequestedAmountBody:
      properties:
        cents:
          type: number
        currency:
          type: string
          enum:
            - EUR
      type: object
      required:
        - cents
        - currency
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
