paths:
  /accounts/me:
    put:
      operationId: provisionAccount
      summary: Provision my account
      tags:
        - identity
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                displayName:
                  minLength: 1
                  type: string
              type: object
      responses:
        '200':
          description: The account, provisioned or refreshed; the body carries its identifier.
          headers:
            Cache-Control:
              description: How the caches on the way may keep this answer.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '401':
          description: 'Unauthorized. Error codes: UNAUTHORIZED.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - UNAUTHORIZED
        '403':
          description: 'Forbidden. Error codes: FORBIDDEN.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - FORBIDDEN
        '406':
          description: 'Not Acceptable. Error codes: NOT_ACCEPTABLE.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - NOT_ACCEPTABLE
        '415':
          description: 'Unsupported Media Type. Error codes: UNSUPPORTED_MEDIA_TYPE.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - UNSUPPORTED_MEDIA_TYPE
        '422':
          description: 'Unprocessable Content. Error codes: ACCOUNT_DEACTIVATED, EMAIL_NOT_VERIFIED, INVALID_DISPLAY_NAME, INVALID_EMAIL_ADDRESS, VALIDATION_FAILED.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - ACCOUNT_DEACTIVATED
            - EMAIL_NOT_VERIFIED
            - INVALID_DISPLAY_NAME
            - INVALID_EMAIL_ADDRESS
            - VALIDATION_FAILED
