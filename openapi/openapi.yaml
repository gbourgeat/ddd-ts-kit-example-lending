                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - UNAUTHORIZED
        '403':
          description: 'Forbidden. Error codes: FORBIDDEN.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - FORBIDDEN
        '413':
