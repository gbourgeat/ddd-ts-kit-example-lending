          in: path
          schema:
            type: string
          required: true
      requestBody:
        required: true
        description: 'Text fields first, then the file: a field sent after the file is not read.'
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: 'The file: application/pdf, image/png, image/jpeg, at most 10485760 bytes, its type checked on its content.'
                  x-max-bytes: 10485760
                  x-media-types:
                    - application/pdf
                    - image/png
                    - image/jpeg
              required:
                - file
            encoding:
              file:
                contentType: application/pdf, image/png, image/jpeg
      responses:
        '201':
          description: Stored; the file is visible once the command has committed.
          headers:
            Cache-Control:
              description: How the caches on the way may keep this answer.
