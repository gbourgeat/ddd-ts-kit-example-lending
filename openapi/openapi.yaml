  /applications:
    get:
      operationId: searchApplications
      summary: Search applications
      tags:
        - credit-application
      security:
        - bearer: []
      parameters:
        - name: limit
          in: query
          description: Size of the page.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            description: Size of the page.
        - name: offset
          in: query
          description: Items to skip. Not with `cursor`.
          required: false
          schema:
            type: integer
            minimum: 0
            description: Items to skip. Not with `cursor`.
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page. Not with `offset`.
          required: false
          schema:
            type: string
            minLength: 1
            description: The `nextCursor` of the previous page. Not with `offset`.
        - name: sort
          in: query
          description: 'Comma-separated fields, a leading "-" for descending. Sortable: id.'
          required: false
          schema:
            type: string
            description: 'Comma-separated fields, a leading "-" for descending. Sortable: id.'
      responses:
        '200':
          description: One page of the applications the caller may see.
          headers:
            Cache-Control:
              description: How the caches on the way may keep this answer.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      properties:
                        id:
                          type: string
                        applicantId:
                          type: string
                        requestedAmountCents:
                          type: number
                        durationMonths:
                          type: number
                      type: object
                      required:
                        - id
                        - applicantId
                        - requestedAmountCents
                        - durationMonths
                  total:
                    type: integer
                    minimum: 0
                    description: Present when it is cheap to count.
                  nextCursor:
                    type: string
                    description: Present when more items follow.
        '401':
          description: 'Unauthorized. Error codes: UNAUTHORIZED.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-error-codes:
            - UNAUTHORIZED
        '403':
